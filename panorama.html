<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园导览 · 星图校园</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg?v=2">
  <link rel="stylesheet" href="styles.css?v=13">
  <link rel="stylesheet" href="css/campus-tools.css?v=7">
  <script src="js/panorama.js" defer></script>
</head>
<body>
  <main class="campus-panorama">
    <header>
      <a class="button button-small button-ghost" href="./#map">← 返回星图校园</a>
      <h1>东莞职业技术学院 · 校园导览</h1>
      <p>先在沙盘里看懂建筑分布，再进入全景看看现场。</p>
    </header>
    <div class="campus-panorama-modes">
      <section class="campus-panorama-card" aria-labelledby="campus-map-title">
        <span class="campus-panorama-tag">3D 沙盘</span>
        <h2 id="campus-map-title">俯瞰校本部</h2>
        <p>拖动、旋转和缩放地图，按区域或地点类型筛选，点击地标查看详情。</p>
        <a class="button button-secondary" href="map3d.html">打开 3D 沙盘 →</a>
      </section>
      <section id="vr-tour" class="campus-panorama-card" aria-labelledby="campus-vr-title">
        <span class="campus-panorama-tag">360° 全景</span>
        <h2 id="campus-vr-title">VR 全景漫游</h2>
        <p>拖动环顾实景，缩放查看细节，通过场景列表或热点前往下一个地点。</p>
        <button id="campus-tour-toggle" class="button button-secondary" type="button"
          aria-controls="campus-tour-player" aria-expanded="false" hidden>进入全景漫游 →</button>
        <a class="button button-ghost" href="https://www.720yun.com/t/14vk6hf7O8h?scene_id=107800357"
          target="_blank" rel="noopener noreferrer">在 720 云查看原作 ↗</a>
        <p class="campus-panorama-credit">全景来源为花尔工作室的 720 云作品，原作的观看条件以平台为准。</p>
      </section>
    </div>
    <section id="campus-tour-player" class="campus-panorama-player" aria-label="校园全景播放器" hidden>
      <iframe title="东莞职业技术学院 360° 实景" allowfullscreen></iframe>
      <a class="button button-small button-ghost" href="assets/campus-tour/index.html"
        target="_blank" rel="noopener noreferrer">在新窗口打开全景 ↗</a>
    </section>
    <section class="campus-panorama-places" aria-labelledby="campus-panorama-places-title">
      <h2 id="campus-panorama-places-title">地点照片</h2>
      <div>
        <a class="button button-small button-ghost" href="./#place/library">图书馆</a>
        <a class="button button-small button-ghost" href="./#place/stadium">田径场</a>
        <a class="button button-small button-ghost" href="./#place/cafeteria">滋兰餐厅</a>
      </div>
    </section>
  </main>
</body>
</html>
