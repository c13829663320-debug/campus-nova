<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef6f2">
  <title>3D 校园地图 · 星图校园</title>
  <script src="js/theme.js?v=1"></script>
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg?v=2">
  <link rel="stylesheet" href="css/map3d.css?v=2">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
  <script type="module" src="js/map3d/page.js?v=2"></script>
</head>
<body>
  <main class="atlas">
    <nav class="atlas-nav" aria-label="校园导览">
      <a class="atlas-brand" href="panorama.html"><img src="assets/logo-mark.svg?v=2" alt="" width="34" height="34"> 星图校园 <span>／ 校园导览</span></a>
      <a class="atlas-vr" href="panorama.html#vr-tour">VR 全景 <span aria-hidden="true">↗</span></a>
    </nav>

    <header class="atlas-header">
      <div>
        <p class="atlas-kicker"><span></span> CAMPUS ATLAS <span class="kicker-divider"></span> 松山湖校区</p>
        <h1>3D 校园地图</h1>
        <p class="atlas-school">东莞职业技术学院</p>
      </div>
      <p class="atlas-intro">从映月湖出发，看看教学楼、宿舍和运动场如何连在一起。选择地标，地图会带你靠近。</p>
    </header>

    <div class="atlas-workspace">
      <section class="atlas-map" aria-label="校园三维沙盘">
        <div class="atlas-map-bar">
          <div class="atlas-map-title"><span class="atlas-model-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5m-9 5v8"/></svg></span><span><strong>校园沙盘</strong><small id="map-status" role="status">正在加载 3D 模型</small></span></div>
          <label class="atlas-zone">区域视角<select id="zone" disabled><option value="">全校视角</option></select></label>
        </div>

        <div class="map-stage" id="stage">
          <img class="atlas-preview" src="assets/campus3d/overview.webp" alt="松山湖校区三维模型预览" width="1280" height="780" draggable="false">
          <div class="atlas-controls" id="map-controls" aria-label="地图控制" hidden>
            <button type="button" id="zoom-in" aria-label="放大" title="放大">+</button>
            <button type="button" id="zoom-out" aria-label="缩小" title="缩小">−</button>
            <button type="button" id="rotate-view" aria-label="旋转视角" title="旋转 45°"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 1-2.1-5.4L20 9"/></svg></button>
            <button type="button" id="zoom-reset" aria-label="重置视角" title="重置视角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/><circle cx="12" cy="12" r="2.5"/></svg></button>
          </div>
        </div>

        <footer class="atlas-map-footer">
          <span id="map-hint">拖动平移 · 滚轮或双指缩放</span>
          <span>依据校园资料建模 · 位置与比例为近似</span>
        </footer>
      </section>

      <aside class="atlas-guide" aria-labelledby="guide-title">
        <div class="atlas-guide-heading">
          <p class="atlas-kicker">LANDMARKS</p>
          <h2 id="guide-title">探索地标</h2>
          <p>在地图上定位，或按类别浏览。</p>
        </div>
        <div class="atlas-filters" id="filters" role="group" aria-label="地标类别"></div>
        <div class="atlas-detail" id="place-detail" aria-live="polite" hidden></div>
        <p class="atlas-list-count" id="result-count" aria-live="polite"></p>
        <ul class="atlas-places" id="places"></ul>
      </aside>
    </div>
    <noscript><p>启用 JavaScript 后可操作三维地图和地标列表。</p></noscript>
  </main>
</body>
</html>
