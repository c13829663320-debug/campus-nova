<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星图校园 · Logo 预览</title>
<style>
  :root{
    --ink:#111111; --muted:#787878; --line:rgba(0,0,0,.08);
    --ivory:#F8F8F8; --dark:#000000; --dark-surface:#141414; --dark-text:#F5F5F5;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans SC",sans-serif;background:var(--ivory);color:var(--ink)}
  .wrap{max-width:1040px;margin:0 auto;padding:48px 28px 72px}
  h1{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 28px}
  section{border-radius:24px;padding:36px;margin-bottom:24px;border:1px solid var(--line)}
  .light{background:#fff}
  .dark{background:var(--dark);border-color:rgba(255,255,255,.08);color:var(--dark-text)}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:32px}
  .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 16px}
  .dark .label{color:#9C9C9C}
  .lockup{width:min(320px,100%);height:auto}
  .sizes{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}
  .sizes figure{margin:0;text-align:center}
  .sizes img{display:block;margin:0 auto 8px;border-radius:28%}
  .sizes figcaption{font-size:11px;color:var(--muted);letter-spacing:.06em}
  .tab{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:999px;background:#F1F1F1;color:#111;font-size:13px;font-weight:700}
  .tab img{width:20px;height:20px;border-radius:28%}
  .chip-mint{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;background:#E7FFF9;color:#07714F;font-size:13px;font-weight:700}
  .chip-mint img{width:28px;height:28px;border-radius:28%}
  footer{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <h1>星图校园 Campus Nova · Logo</h1>

  <section class="light">
    <p class="label">横版锁定组合 / 浅色背景</p>
    <img class="lockup" src="assets/logo-lockup.svg" alt="星图校园 Campus Nova 横版 Logo">

    <p class="label" style="margin-top:40px">尺寸缩略</p>
    <div class="sizes">
      <figure><img src="assets/logo-mark.svg" width="96" height="96" alt=""><figcaption>96 px</figcaption></figure>
      <figure><img src="assets/logo-mark.svg" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
      <figure><img src="assets/logo-mark.svg" width="48" height="48" alt=""><figcaption>48 px</figcaption></figure>
      <figure><img src="assets/logo-mark.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
      <figure><img src="assets/logo-mark.svg" width="24" height="24" alt=""><figcaption>24 px</figcaption></figure>
    </div>

    <p class="label" style="margin-top:40px">应用场景</p>
    <div class="row">
      <span class="tab"><img src="assets/logo-mark.svg" alt="">星图校园</span>
      <span class="chip-mint"><img src="assets/logo-mark.svg" alt="">成就 · 打卡</span>
    </div>
  </section>

  <section class="dark">
    <p class="label">横版锁定组合 / 深色背景</p>
    <img class="lockup" src="assets/logo-lockup-dark.svg" alt="星图校园 Campus Nova 横版 Logo（深色版）">
    <div class="sizes" style="margin-top:32px">
      <figure><img src="assets/logo-mark.svg" width="64" height="64" alt=""><figcaption style="color:#8A9B93">64 px</figcaption></figure>
      <figure><img src="assets/logo-mark.svg" width="32" height="32" alt=""><figcaption style="color:#8A9B93">32 px</figcaption></figure>
    </div>
  </section>

  <footer>
    主色 #111111 · 星芒 #1FFD91 · 薄荷 #E7FFF9 · 底图 #F8F8F8 · 深色底 #000000<br>
    结构：点状星轨 + 四芒诺瓦星 + 对角伴星，对应「星图 · 坐标 · 打卡」。副标题浅色版 #6E6E6E、深色版 #9C9C9C，保证文字对比度。
  </footer>
</div>
</body>
</html>
