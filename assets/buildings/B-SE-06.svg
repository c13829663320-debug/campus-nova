<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-95 -10 190 140">
  <title>B-SE-06 球场旁白色立方体方楼</title>
  <desc>approximate vector rebuild from selected-campus-map.jpg; plain white box, no visible windows; occluded faces not reconstructed</desc>
  <!-- box: a=75 (right axis), b=50 (left axis), h=55. P1=(0,0) P2=(75,37.5) P3=(0,62.5) P4=(-50,25) -->
  <g id="base">
    <ellipse cx="0" cy="120" rx="80" ry="16" fill="#7FA85C" opacity="0.18"/>
    <polygon points="0,62.5 75,37.5 75,50.5 0,75.5 -50,38 -50,25" fill="#86B060" opacity="0.55"/>
  </g>
  <g id="walls">
    <!-- lit left wall -->
    <polygon points="-50,25 0,62.5 0,117.5 -50,80" fill="#F5F1E8"/>
    <!-- shadow right wall -->
    <polygon points="75,37.5 0,62.5 0,117.5 75,92.5" fill="#D9D4C8"/>
  </g>
  <g id="roof">
    <polygon points="0,0 75,37.5 0,62.5 -50,25" fill="#FFFFFF"/>
    <polygon points="-50,25 0,62.5 0,67.5 -50,30" fill="#E8E6E0"/>
  </g>
  <g id="mask"/>
</svg>
