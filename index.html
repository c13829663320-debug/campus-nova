<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E7F3FD">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="星图校园 Campus Nova：东莞职业技术学院校园探索平台，聚合 2.5D 校园地图、89 个学生社团、校园论坛与个人探索档案。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="星图校园 · Campus Nova">
  <meta property="og:description" content="东莞职业技术学院校园探索平台：等距校园地图导览、89 个社团图鉴、校园论坛与个人探索档案。">
  <meta property="og:image" content="assets/hero/atlas-day.jpg">
  <title>星图校园 · Campus Nova</title>
  <script src="js/theme.js?v=1"></script>
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg?v=2">
  <link rel="stylesheet" href="styles.css?v=19">
  <link rel="stylesheet" href="css/atlas.css?v=4">
  <link rel="stylesheet" href="css/activities.css?v=5">
  <link rel="stylesheet" href="css/campus-tools.css?v=7">
</head>
<body data-page="map">
  <div class="sky" id="sky" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="side-rail">
      <a class="brand" href="#map" aria-label="星图校园首页">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/logo-mark.svg?v=2" width="38" height="38" alt="">
        </span>
        <span class="brand-copy"><strong>星图校园</strong><small>CAMPUS NOVA</small></span>
      </a>

      <nav class="primary-nav" aria-label="主导航">
        <p class="rail-label" aria-hidden="true">校园导航</p>
        <a href="#map" data-nav="map" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 7 9 4Z"/><path d="M9 4v13M15 7v12.5"/></svg>
          <span>星图</span>
        </a>
        <a href="#forum" data-nav="forum">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5a8 8 0 0 1-8 8H7.2L3.5 22v-6.3a8 8 0 0 1 8.5-12.2 8 8 0 0 1 8.5 8Z"/></svg>
          <span>论坛</span>
        </a>
        <a href="#clubs" data-nav="clubs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16.2 5.4a3.4 3.4 0 0 1 0 5.2"/><path d="M17.6 14.6A6.2 6.2 0 0 1 21.2 20"/></svg>
          <span>社团</span>
        </a>
        <a href="#events" data-nav="events">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
          <span>活动</span>
        </a>
        <a href="#me" data-nav="me">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></svg>
          <span>我的</span>
        </a>
      </nav>

      <div class="campus-tools" role="group" aria-labelledby="rail-tools-label">
        <p class="rail-label" id="rail-tools-label">校园工具</p>
        <button id="open-campus-ai" class="button button-small" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/></svg>
          AI 校园助手
        </button>
        <a id="feedback-link" class="button button-small" href="https://ucnr583x0txz.feishu.cn/share/base/form/shrcnRNbe5UEvJtgthU7VFFDpzf" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8m-8 4h5"/></svg>
          用户反馈
        </a>
      </div>

      <div class="rail-bottom">
        <button class="rail-theme" type="button" data-action="toggle-theme" aria-label="切换深色主题">
          <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
          <span>切换主题</span>
          <span class="rail-theme-mode" aria-hidden="true"><span class="theme-icon-light">浅色</span><span class="theme-icon-dark">深色</span></span>
        </button>
        <a class="rail-user" href="#me" aria-label="进入个人中心">
          <span class="avatar avatar-small" data-shell-avatar>星</span>
          <div><strong data-shell-name>同学</strong><span data-shell-meta>校园身份核验中</span></div>
          <svg class="rail-user-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </div>
    </aside>

    <button class="icon-button mobile-theme" type="button" data-action="toggle-theme" aria-label="切换深色主题">
      <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
    </button>

    <main class="app-main">
      <div class="page-head">
        <p id="page-eyebrow">CAMPUS NOVA</p>
        <h1 id="page-title">正在加载星图</h1>
        <p id="page-subtitle">今天，从一个新地点开始认识校园。</p>
      </div>

      <div id="app-view" class="view-container" tabindex="-1">
        <div class="initial-skeleton" aria-label="正在加载星图">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-map"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <dialog id="campus-ai" class="campus-dialog" aria-labelledby="campus-ai-title">
    <header class="campus-dialog-head">
      <img src="assets/logo-mark.svg?v=2" width="44" height="44" alt="">
      <div class="campus-agent-title">
        <p class="campus-dialog-kicker">CAMPUS NOVA</p>
        <h2 id="campus-ai-title">星图校园助手</h2>
      </div>
      <button id="campus-new-chat" class="campus-agent-tool" type="button">＋ 新对话</button>
      <form method="dialog"><button class="campus-agent-tool campus-agent-close" aria-label="关闭助手">×</button></form>
    </header>
    <div id="campus-agent-body" class="campus-agent-body">
      <section id="campus-agent-welcome" class="campus-agent-welcome">
        <p class="campus-dialog-kicker">你的校园 AI 搭档</p>
        <h3>今天想在校园里做什么？</h3>
        <p>查地点、找社团、写活动方案，或把灵感变成一张图。助手会根据你的请求选择合适的能力。</p>
        <div class="campus-prompts" aria-label="试试这样问">
          <button type="button" data-prompt="校园里哪里适合自习？"><span>校园查询</span><strong>找个地方自习</strong></button>
          <button type="button" data-prompt="帮我起草一份校园组局招募文案。活动主题是"><span>文字创作</span><strong>写组局招募</strong></button>
          <button type="button" data-prompt="生成一张校园活动海报，主题是秋日校园音乐会，暖色插画风，不要添加小字。"><span>图像生成</span><strong>做一张活动海报</strong></button>
        </div>
      </section>
      <div id="campus-chat" class="campus-chat" role="log" aria-label="对话记录"></div>
    </div>
    <form id="campus-chat-form" class="campus-agent-compose">
      <p id="campus-chat-status" class="campus-agent-status" role="status" hidden></p>
      <div id="campus-agent-files" class="campus-agent-files" aria-label="已添加的附件" hidden></div>
      <label class="campus-agent-label" for="campus-question">给校园助手发消息</label>
      <textarea id="campus-question" rows="2" maxlength="1500" placeholder="说说你想做什么，也可以上传图片或文档…"></textarea>
      <div class="campus-agent-actions">
        <input id="campus-agent-file" type="file" accept="image/png,image/jpeg,image/webp,.txt,.md,.csv" multiple hidden>
        <input id="campus-agent-audio" type="file" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg,.webm,.aac" capture hidden>
        <button id="campus-attach" class="campus-agent-tool" type="button">＋ 附件</button>
        <button id="campus-voice" class="campus-agent-tool" type="button" aria-pressed="false">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-3 0h6"/></svg>
          <span>语音输入</span>
        </button>
        <button class="button button-small campus-agent-send" type="submit" disabled>发送 <span aria-hidden="true">↑</span></button>
      </div>
      <p class="campus-agent-privacy">本次页面内记住对话。提交的消息和附件会发送至模型服务，请勿填写个人敏感信息。</p>
    </form>
  </dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="noscript">请启用 JavaScript 以体验星图校园交互原型。</div></noscript>

  <script src="js/sky.js?v=3" defer></script>
  <script src="js/china-map.js?v=3" defer></script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
  <script src="js/mock.js?v=11" defer></script>
  <script src="js/store.js?v=4" defer></script>
  <script src="js/api.js?v=8" defer></script>
  <script src="js/activity-tags.js?v=2" defer></script>
  <script src="js/app.js?v=28" defer></script>
  <script src="js/campus-tools.js?v=3" defer></script>
</body>
</html>
